[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mrrate-vlm"
version = "0.1.0"
description = "Patient-aware 2.5D MRI-report retrieval with frozen MedSigLIP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "nibabel>=5.2,<6",
  "Pillow>=10,<13", "matplotlib>=3.8,<4", "PyYAML>=6,<7",
  "huggingface-hub>=0.30,<3",
]

[project.optional-dependencies]
model = ["torch>=2.5,<3", "transformers>=4.51,<6", "safetensors>=0.5,<1", "sentencepiece>=0.2,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
mrrate-vlm = "mrrate_vlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["MR_RATE_Codex_Handoff"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
